<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CSI 3660 Study Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: left rail of courses > chapters > sections, one reading column, mode tabs (Notes / Cheat sheet / Flashcards / Quiz) per chapter */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --rail: #e3e9ee;
  --ink: #16202b;
  --muted: #5a6877;
  --line: #cfd8e0;
  --accent: #2552c9;
  --accent-ink: #ffffff;
  --mark: #9eeaf5;
  --term-bg: #1a2230;
  --term-fg: #d7e2ee;
  --term-prompt: #7fd3e3;
  --term-dim: #8b9bb0;
  --term-cmd: #ffffff;
  --good: #1d7a4a;
  --good-bg: #dff3e7;
  --bad: #b23a2e;
  --bad-bg: #fbe4e1;
  --warn-bg: #fff4d6;
  --warn-line: #d9a514;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #18202a; --rail: #141b23; --ink: #e2e8ef; --muted: #93a2b3;
    --line: #2a3542; --accent: #7d9eff; --accent-ink: #0d1420; --mark: #1f5964;
    --term-bg: #0b0f15; --term-fg: #d7e2ee; --term-prompt: #7fd3e3; --term-dim: #7d8ca0;
    --good: #6fd39c; --good-bg: #173326; --bad: #ff8f80; --bad-bg: #3a1e1b;
    --warn-bg: #2e2714; --warn-line: #c99a1e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #18202a; --rail: #141b23; --ink: #e2e8ef; --muted: #93a2b3;
  --line: #2a3542; --accent: #7d9eff; --accent-ink: #0d1420; --mark: #1f5964;
  --term-bg: #0b0f15; --term-fg: #d7e2ee; --term-prompt: #7fd3e3; --term-dim: #7d8ca0;
  --good: #6fd39c; --good-bg: #173326; --bad: #ff8f80; --bad-bg: #3a1e1b;
  --warn-bg: #2e2714; --warn-line: #c99a1e; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--rail); }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--f-mono); font-size: 0.88em; }
:not(pre) > code { background: var(--rail); border: 1px solid var(--line); padding: 0.05em 0.35em; border-radius: 4px; white-space: nowrap; }
strong { font-weight: 700; }
mark { background: var(--mark); color: inherit; padding: 0 0.15em; border-radius: 2px; }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100%; }

/* ---------- rail ---------- */
.rail {
  background: var(--rail); border-right: 1px solid var(--line);
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px));
  overflow-y: auto; padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 20px;
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.hide-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; color: var(--muted); }
.hide-btn:hover { color: var(--ink); border-color: var(--muted); }
.hide-btn svg, .show-ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
#menuBtn { display: inline-flex; align-items: center; gap: 6px; }
@media (min-width: 881px) {
  .app.collapsed { grid-template-columns: minmax(0, 1fr); }
  .app.collapsed .rail { display: none; }
  .app.collapsed .topbar { display: flex; align-items: center; gap: 10px; }
}
.brand .perm { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.brand .perm b { color: var(--accent); font-weight: 600; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
.search { position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 14px; padding: 8px 10px 8px 30px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
}
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); fill: none; }
.course-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
.chap-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.chap-btn {
  width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 6px;
  display: grid; grid-template-columns: 38px 1fr; gap: 6px; align-items: baseline; font-size: 15px;
}
.chap-btn .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.chap-btn:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.chap-btn[aria-current="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 700; }
.chap-btn[aria-current="true"] .num { color: var(--accent); }
.sec-list { list-style: none; margin: 4px 0 8px 44px; padding: 0 0 0 10px; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.sec-list a { display: block; font-size: 13.5px; color: var(--muted); text-decoration: none; padding: 3px 0; line-height: 1.35; }
.sec-list a:hover { color: var(--ink); }
.rail-foot { margin-top: auto; font-size: 12.5px; color: var(--muted); line-height: 1.45; }

/* ---------- main ---------- */
.main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.topbar { display: none; }

.chap-head { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
.chap-head h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 6vw, 52px); line-height: 1.02; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.lsline {
  font-family: var(--f-mono); font-size: 13px; color: var(--muted); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; overflow-x: auto; white-space: nowrap;
}
.lsline .t { color: var(--accent); font-weight: 600; outline: 1.5px solid var(--accent); border-radius: 50%; padding: 0 3px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 6px; overflow-x: auto; }
.tab {
  background: none; border: 0; padding: 10px 14px; font-weight: 700; font-size: 15px; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---------- notes ---------- */
.section { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 64px; padding-top: 8px; }
.section + .section { border-top: 1px solid var(--line); padding-top: 28px; }
.section h3 { font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; text-wrap: balance; display: flex; gap: 10px; align-items: baseline; }
.section h3 .sn { font-family: var(--f-mono); font-size: 13px; font-weight: 400; color: var(--muted); }
.section p { margin: 0; max-width: 68ch; }
.section ul { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 6px; max-width: 68ch; }
.section ul ul { margin-top: 6px; }
.section li::marker { color: var(--muted); }
.section ol { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 3px; }
.section ol li::marker { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }

.def { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; }
.def .tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: var(--accent); }
.def .term { font-weight: 700; }
.def .body { grid-column: 1 / -1; }

.note { border-left: 3px solid var(--warn-line); background: var(--warn-bg); padding: 10px 14px; border-radius: 0 6px 6px 0; max-width: 68ch; }
.note.tip { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.note .lbl { font-weight: 700; margin-right: 6px; }

.term { margin: 0; }
pre.term {
  background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: 13.5px; line-height: 1.55;
  padding: 14px 16px; border-radius: 8px; overflow-x: auto; margin: 0;
}
pre.term .p { color: var(--term-prompt); user-select: none; }
pre.term .c { font-weight: 600; color: var(--term-cmd); }
pre.term .o { color: var(--term-dim); }
.cap { font-size: 14px; color: var(--muted); margin-top: -6px; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); background: var(--rail); }
tr:last-child td { border-bottom: 0; }
td.k { font-family: var(--f-mono); font-size: 14px; white-space: nowrap; font-weight: 600; }

/* ---------- cheat sheet ---------- */
.cheat-filter { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cheat { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.cmd { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cmd code { font-family: var(--f-mono); font-size: 14px; font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
.cmd span { font-size: 14.5px; }

/* ---------- flashcards ---------- */
.fc-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.fc-meta { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; font-weight: 700; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.btn.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.progress { height: 6px; background: var(--rail); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; background: var(--good); width: 0; transition: width .25s; }

.card-stage { perspective: 1400px; }
.card {
  position: relative; width: 100%; min-height: 280px; border: 0; padding: 0; background: none; text-align: left;
  transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1);
}
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 28px 44px;
  display: flex; flex-direction: column; justify-content: center; gap: 12px;
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(10, 20, 40, .35);
}
.face.back { transform: rotateY(180deg); }
.face .side { position: absolute; top: 14px; left: 18px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.face .hint { position: absolute; bottom: 14px; right: 18px; font-size: 12px; color: var(--muted); }
.face .q { font-family: var(--f-display); font-size: clamp(21px, 3.4vw, 28px); font-weight: 700; line-height: 1.25; text-wrap: balance; }
.face .a { font-size: 18px; line-height: 1.55; }
.face .a ul { margin: 0; padding-left: 1.2em; }
.known-pill { font-size: 12px; font-weight: 700; color: var(--good); background: var(--good-bg); border-radius: 999px; padding: 2px 10px; }

/* ---------- quiz ---------- */
.quiz { display: flex; flex-direction: column; gap: 16px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.qcard .qn { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.qcard .qt { font-weight: 700; font-size: 17px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 9px 12px; display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: baseline; }
.opt .l { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.right .l { color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.wrong .l { color: var(--bad); }
.explain { font-size: 15px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.explain b { color: var(--ink); }
.score { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
.score .big { font-family: var(--f-display); font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; }

/* ---------- search results ---------- */
.results { display: flex; flex-direction: column; gap: 8px; }
.result { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.result:hover { border-color: var(--accent); }
.result .w { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.result .s { font-size: 14.5px; }
.empty { color: var(--muted); }

/* ---------- small screens ---------- */
@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; }
  .rail {
    position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); height: 100%; z-index: 40;
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); transform: translateX(-102%); transition: transform .25s;
    box-shadow: 0 0 40px rgba(0,0,0,.25);
  }
  .rail.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(8, 12, 18, .45); z-index: 35; }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar .t { font-family: var(--f-display); font-weight: 700; font-size: 16px; }
  .main { padding-top: 14px; }
  .face { padding: 26px 20px 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .rail, .progress > i { transition: none; }
}
</style>

<div class="app">
  <aside class="rail" id="rail" aria-label="Chapters">
    <div class="rail-top">
      <div class="brand">
        <span class="perm"><b>d</b>rwxr-xr-x&nbsp; notes/</span>
        <h1>CSI 3660 Study Deck</h1>
      </div>
      <button class="hide-btn" id="hideBtn" aria-label="Hide sidebar" title="Hide sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M16 9l-3 3 3 3"/></svg></button>
    </div>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search all notes" autocomplete="off">
    </label>
    <nav id="nav"></nav>
    <div class="rail-foot">Flashcard progress is saved in this browser only.</div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <div class="col">
      <div class="topbar">
        <button class="btn" id="menuBtn" aria-controls="rail" aria-expanded="false" title="Show sidebar"><svg class="show-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M13 9l3 3-3 3"/></svg>Chapters</button>
        <span class="t" id="topTitle"></span>
      </div>
      <div id="view"></div>
    </div>
  </main>
</div>

<script>
/* =====================================================================
   CHAPTER DATA
   To add a chapter or lecture, append an object to CHAPTERS:
   {
     id: "ch06",                         // used in the link: #ch06, #ch06-quiz
     course: "CSI 3660 · System Administration",
     num: "06",  title: "Access Control",  source: "Lecture notes",
     sections: [ { title: "...", blocks: [ ...see block types... ] } ],
     cheats:    [ { cmd: "chmod 755 f", does: "...", tag: "Permissions" } ],
     cards:     [ { q: "front", a: "back" } ],
     quiz:      [ { q: "question", options: ["a","b","c","d"], answer: 0, why: "..." } ]
   }
   Block types:
     { t:"p", text }                      paragraph
     { t:"list", items:[ "text" | ["text", [subitems...]] ] }
     { t:"olist", items:[...] }           numbered list
     { t:"def", term, text, tag? }        definition box
     { t:"note", text, kind:"warn"|"tip" }
     { t:"term", lines:["$ cmd", "output"], cap? }   terminal; "$ " lines are commands
     { t:"table", head:[...], rows:[[...]], key:true? }  key = first column monospace
   Inline: `code`  **bold**
   ===================================================================== */
const CHAPTERS = [
{
  id: "ch05",
  course: "CSI 3660 · System Administration",
  num: "05",
  title: "The Filesystem",
  source: "Chapter 5 notes",
  sections: [
    { title: "What a filesystem is", blocks: [
      { t:"p", text:"Which of these would you expect to find in a filesystem: processes, audio devices, kernel data structures and tuning parameters, interprocess communication channels? On UNIX or Linux the answer is **all of the above, and more**." },
      { t:"def", tag:"Purpose", term:"Filesystem", text:"Represents and organizes the system's storage resources." },
      { t:"p", text:"A filesystem has four main components:" },
      { t:"table", head:["Component","What it is"], rows:[
        ["Namespace","A way to name things and organize them in a hierarchy"],
        ["API","A set of system calls for navigating and manipulating objects"],
        ["Security model","Schemes for protecting, hiding, and sharing things"],
        ["Implementation","Software that ties the logical model to the hardware"]
      ]},
      { t:"list", items:[
        "Some parts of the file tree are handled by traditional disk-based implementations.",
        ["Others are handled by separate drivers inside the kernel.", [
          "Example: network filesystems use a driver that forwards requested operations to a server on another computer."
        ]]
      ]},
      { t:"def", tag:"Definition", term:"Device files", text:"Give programs a way to communicate with drivers inside the kernel. They aren't really data files, but they're handled through the filesystem and their characteristics are stored on disk." },
      { t:"list", items:[
        ["The kernel supports more than one type of disk-based filesystem. Predominant standards:", [
          "**ext4**, **XFS**, and **UFS**",
          "Oracle's **ZFS** and **Btrfs**"
        ]]
      ]}
    ]},
    { title: "Mounting and unmounting", blocks: [
      { t:"list", items:[
        "The file tree is composed of smaller filesystems, each consisting of one directory plus its subdirectories and files.",
        "Some filesystems live on disk partitions or on logical volumes backed by physical disks.",
        "Most kernels have a **loop** filesystem that lets you mount individual files as if they were distinct devices. This lets you duplicate, move, or hide portions of the file tree."
      ]},

/* ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const plain = s => String(s).replace(/[`*]/g, "");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const MODES = [["notes","Notes"],["cheat","Cheat sheet"],["cards","Flashcards"],["quiz","Quiz"]];
let state = { ch: CHAPTERS[0].id, mode: "notes", search: "" };
const fc = {}; // per-chapter flashcard session
const qz = {}; // per-chapter quiz answers

function chap(id) { return CHAPTERS.find(c => c.id === id) || CHAPTERS[0]; }
function slug(c, i) { return c.id + "-s" + (i + 1); }

/* ---------- nav ---------- */
function renderNav() {
  const courses = {};
  CHAPTERS.forEach(c => (courses[c.course] = courses[c.course] || []).push(c));
  let h = "";
  for (const [course, list] of Object.entries(courses)) {
    h += `<p class="course-label">${esc(course)}</p><ul class="chap-list">`;
    for (const c of list) {
      const cur = c.id === state.ch;
      h += `<li><button class="chap-btn" data-ch="${c.id}" aria-current="${cur}"><span class="num">Ch ${esc(c.num)}</span><span>${esc(c.title)}</span></button>`;
      if (cur && state.mode === "notes" && !state.search) {
        h += `<ul class="sec-list">` + c.sections.map((s, i) => `<li><a href="#${slug(c,i)}" data-sec="${slug(c,i)}">${esc(s.title)}</a></li>`).join("") + `</ul>`;
      }
      h += `</li>`;
    }
    h += `</ul>`;
  }
  $("#nav").innerHTML = h;
}

/* ---------- blocks ---------- */
function listHTML(items, tag="ul") {
  return `<${tag}>` + items.map(it => Array.isArray(it)
    ? `<li>${fmt(it[0])}${listHTML(it[1])}</li>` : `<li>${fmt(it)}</li>`).join("") + `</${tag}>`;
}
function block(b) {
  switch (b.t) {
    case "p": return `<p>${fmt(b.text)}</p>`;
    case "list": return listHTML(b.items);
    case "olist": return listHTML(b.items, "ol");
    case "def": return `<div class="def"><span class="tag">${esc(b.tag || "Term")}</span><span class="term">${fmt(b.term)}</span><div class="body">${fmt(b.text)}</div></div>`;
    case "note": return `<div class="note ${b.kind === "tip" ? "tip" : ""}"><span class="lbl">${b.kind === "tip" ? "Tip" : "Watch out"}</span>${fmt(b.text)}</div>`;
    case "term": {
      const lines = b.lines.map(l => {
        if (/^\S*\$ /.test(l)) { const i = l.indexOf("$ ") + 2; return `<span class="p">${esc(l.slice(0, i))}</span><span class="c">${esc(l.slice(i))}</span>`; }
        return `<span class="o">${esc(l)}</span>`;
      }).join("\n");
      return `<pre class="term">${lines}</pre>` + (b.cap ? `<p class="cap">${fmt(b.cap)}</p>` : "");
    }
    case "table": return `<div class="tbl-wrap"><table><thead><tr>${b.head.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>` +
      b.rows.map(r => `<tr>${r.map((x, i) => `<td${b.key && i === 0 ? ' class="k"' : ""}>${fmt(x)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
  }
  return "";
}

/* ---------- views ---------- */
function header(c) {
  return `<header class="chap-head">
    <span class="eyebrow">${esc(c.course)} · Chapter ${esc(c.num)}</span>
    <h2>${esc(c.title)}</h2>
    <div class="lsline"><span class="t">d</span>rwxr-xr-x&nbsp; ${c.sections.length} sections&nbsp; ${c.cards.length} cards&nbsp; ${c.quiz.length} questions&nbsp; ${esc(c.source || "")}</div>
  </header>
  <div class="tabs" role="tablist">${MODES.map(([k, l]) => `<button class="tab" role="tab" data-mode="${k}" aria-selected="${state.mode === k}">${l}</button>`).join("")}</div>`;
}
function notesView(c) {
  return c.sections.map((s, i) => `<section class="section" id="${slug(c,i)}"><h3><span class="sn">${String(i + 1).padStart(2, "0")}</span>${esc(s.title)}</h3>${s.blocks.map(block).join("")}</section>`).join("");
}
let cheatTag = "All";
function cheatView(c) {
  const tags = ["All", ...new Set(c.cheats.map(x => x.tag))];
  if (!tags.includes(cheatTag)) cheatTag = "All";
  const items = c.cheats.filter(x => cheatTag === "All" || x.tag === cheatTag);
  return `<div class="cheat-filter">${tags.map(t => `<button class="chip" data-tag="${esc(t)}" aria-pressed="${t === cheatTag}">${esc(t)}</button>`).join("")}</div>
    <div class="cheat">${items.map(x => `<div class="cmd"><code>${esc(x.cmd)}</code><span>${fmt(x.does)}</span></div>`).join("")}</div>`;
}

/* flashcards */
function fcSession(c, reset) {
  const known = store.get("known-" + c.id, []);
  if (!fc[c.id] || reset) {
    const order = c.cards.map((_, i) => i);
    fc[c.id] = { order, pos: 0, flipped: false, onlyUnknown: fc[c.id]?.onlyUnknown || false };
  }
  const s = fc[c.id];
  s.known = new Set(known);
  return s;
}
function deck(c, s) { return s.onlyUnknown ? s.order.filter(i => !s.known.has(i)) : s.order; }
function cardsView(c) {
  const s = fcSession(c);
  const d = deck(c, s);
  const pct = Math.round(s.known.size / c.cards.length * 100);
  let body;
  if (!d.length) {
    body = `<div class="qcard"><div class="qt">You've marked every card as known.</div><div class="btn-row"><button class="btn primary" data-act="reset-known">Reset progress</button><button class="btn" data-act="toggle-unknown">Show all cards</button></div></div>`;
  } else {
    if (s.pos >= d.length) s.pos = 0;
    const idx = d[s.pos], card = c.cards[idx];
    body = `<div class="card-stage"><button class="card ${s.flipped ? "flipped" : ""}" id="card" aria-label="Flip card">
        <div class="face front"><span class="side">Question</span><div class="q">${fmt(card.q)}</div><span class="hint">Click or press Space to flip</span></div>
        <div class="face back"><span class="side">Answer</span><div class="a">${fmt(card.a)}</div>${s.known.has(idx) ? '<span class="hint"><span class="known-pill">Known</span></span>' : ""}</div>
      </button></div>
      <div class="fc-bar">
        <div class="btn-row"><button class="btn" data-act="prev" aria-label="Previous card">←</button><button class="btn" data-act="next" aria-label="Next card">→</button></div>
        <div class="btn-row"><button class="btn bad" data-act="again">Still learning</button><button class="btn good" data-act="know">Got it</button></div>
      </div>`;
  }
  return `<div class="fc-bar"><span class="fc-meta">${d.length ? `Card ${Math.min(s.pos + 1, d.length)} of ${d.length}` : "Deck complete"} · ${s.known.size}/${c.cards.length} known</span>
      <div class="btn-row"><button class="btn" data-act="shuffle">Shuffle</button><button class="btn" data-act="toggle-unknown" aria-pressed="${s.onlyUnknown}">${s.onlyUnknown ? "Showing: still learning" : "Showing: all cards"}</button></div></div>
    <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>${body}`;
}

/* quiz */
function quizView(c) {
  const a = qz[c.id] = qz[c.id] || {};
  const done = Object.keys(a).length, right = Object.entries(a).filter(([i, v]) => c.quiz[i].answer === v).length;
  const L = "ABCDEFG";
  const qs = c.quiz.map((q, i) => {
    const pick = a[i], answered = pick !== undefined;
    return `<div class="qcard"><span class="qn">Q${i + 1}</span><div class="qt">${fmt(q.q)}</div><div class="opts">` +
      q.options.map((o, j) => {
        let cls = "";
        if (answered && j === q.answer) cls = "right"; else if (answered && j === pick) cls = "wrong";
        return `<button class="opt ${cls}" data-q="${i}" data-o="${j}" ${answered ? "disabled" : ""}><span class="l">${L[j]}</span><span>${fmt(o)}</span></button>`;
      }).join("") + `</div>` +
      (answered ? `<div class="explain"><b>${pick === q.answer ? "Correct." : "Answer: " + L[q.answer] + "."}</b> ${fmt(q.why)}</div>` : "") + `</div>`;
  }).join("");
  return `<div class="score"><div><div class="big">${right}/${c.quiz.length}</div><div class="fc-meta">${done} of ${c.quiz.length} answered</div></div><button class="btn" data-act="quiz-reset">Retake quiz</button></div><div class="quiz">${qs}</div>`;
}

/* search */
function searchView(term) {
  const t = term.toLowerCase(), out = [];
  const textOf = b => [b.text, b.term, b.cap, ...(b.lines || []), ...((b.items || []).flat(2)), ...((b.rows || []).flat())].filter(Boolean).join(" ");
  for (const c of CHAPTERS) {
    c.sections.forEach((s, i) => {
      const txt = plain(s.title + " " + s.blocks.map(textOf).join(" "));
      const at = txt.toLowerCase().indexOf(t);
      if (at > -1) {
        const st = Math.max(0, at - 50), snip = (st ? "…" : "") + txt.slice(st, at + t.length + 70) + "…";
        const hl = esc(snip).replace(new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
        out.push(`<button class="result" data-go="${c.id}" data-sec="${slug(c,i)}"><span class="w">Ch ${esc(c.num)} · ${esc(s.title)}</span><span class="s">${hl}</span></button>`);
      }
    });
    c.cards.forEach(k => {
      if ((k.q + " " + k.a).toLowerCase().includes(t)) out.push(`<button class="result" data-go="${c.id}" data-mode="cards"><span class="w">Ch ${esc(c.num)} · Flashcard</span><span class="s">${fmt(k.q)}</span></button>`);
    });
  }
  return `<header class="chap-head"><span class="eyebrow">Search</span><h2>“${esc(term)}”</h2><div class="stats"><span><b>${out.length}</b> matches across ${CHAPTERS.length} chapter${CHAPTERS.length > 1 ? "s" : ""}</span></div></header>
    <div class="results">${out.join("") || '<p class="empty">No matches. Try a command name like fuser or a term like inode.</p>'}</div>`;
}

function render(scrollTo) {
  const c = chap(state.ch);
  $("#topTitle").textContent = state.search ? "Search" : `Ch ${c.num} · ${c.title}`;
  renderNav();
  let h;
  if (state.search) h = searchView(state.search);
  else {
    const v = { notes: notesView, cheat: cheatView, cards: cardsView, quiz: quizView }[state.mode](c);
    h = header(c) + `<div class="col" style="gap:${state.mode === "notes" ? 28 : 16}px">${v}</div>`;
  }
  $("#view").innerHTML = `<div class="col">${h}</div>`;
  if (scrollTo) { const el = document.getElementById(scrollTo); if (el) el.scrollIntoView(); }
}

/* ---------- routing ---------- */
function setHash(h) { try { history.replaceState(null, "", "#" + h); } catch { location.hash = h; } }
function fromHash() {
  const h = location.hash.slice(1);
  if (!h) return;
  const c = CHAPTERS.find(x => h === x.id || h.startsWith(x.id + "-"));
  if (!c) return;
  state.ch = c.id; state.search = ""; $("#q").value = "";
  const rest = h.slice(c.id.length + 1);
  if (["cheat","cards","quiz"].includes(rest)) { state.mode = rest; render(); }
  else { state.mode = "notes"; render(/^s\d+$/.test(rest) ? h : null); }
}
function go(ch, mode, sec) {
  state.ch = ch; state.mode = mode || "notes"; state.search = ""; $("#q").value = "";
  setHash(sec || (state.mode === "notes" ? ch : ch + "-" + state.mode));
  try { store.set("last", state.ch); } catch {}
  render(sec);
  if (!sec) window.scrollTo(0, 0);
  closeMenu();
}

/* ---------- events ---------- */
function closeMenu() { $("#rail").classList.remove("open"); $("#scrim").hidden = true; $("#menuBtn").setAttribute("aria-expanded", "false"); }
const isDesktop = () => matchMedia("(min-width: 881px)").matches;
function setCollapsed(v) { $(".app").classList.toggle("collapsed", v); store.set("railHidden", v); }
setCollapsed(store.get("railHidden", false));
$("#hideBtn").onclick = () => { if (isDesktop()) setCollapsed(true); else closeMenu(); };
$("#menuBtn").onclick = () => {
  if (isDesktop()) return setCollapsed(false);
  $("#rail").classList.add("open"); $("#scrim").hidden = false; $("#menuBtn").setAttribute("aria-expanded", "true");
};
$("#scrim").onclick = closeMenu;

$("#nav").addEventListener("click", e => {
  const b = e.target.closest(".chap-btn");
  if (b) return go(b.dataset.ch, b.dataset.ch === state.ch ? state.mode : "notes");
  const a = e.target.closest("[data-sec]");
  if (a) { e.preventDefault(); setHash(a.dataset.sec); document.getElementById(a.dataset.sec)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); closeMenu(); }
});

let qTimer;
$("#q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.search = e.target.value.trim(); render(); }, 120);
});

$("#view").addEventListener("click", e => {
  const c = chap(state.ch);
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.mode && !t.dataset.go) return go(c.id, t.dataset.mode);
  if (t.dataset.go) return go(t.dataset.go, t.dataset.mode, t.dataset.sec);
  if (t.dataset.tag) { cheatTag = t.dataset.tag; return render(); }
  if (t.id === "card") { fc[c.id].flipped = !fc[c.id].flipped; t.classList.toggle("flipped"); return; }
  if (t.dataset.q !== undefined) { qz[c.id][t.dataset.q] = +t.dataset.o; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const act = t.dataset.act; if (!act) return;
  if (act === "quiz-reset") { qz[c.id] = {}; render(); window.scrollTo(0, 0); return; }
  fcAction(c, act);
});

function fcAction(c, act) {
  const s = fcSession(c), d = deck(c, s);
  const known = new Set(store.get("known-" + c.id, []));
  if (act === "next") { s.pos = (s.pos + 1) % Math.max(d.length, 1); s.flipped = false; }
  else if (act === "prev") { s.pos = (s.pos - 1 + d.length) % Math.max(d.length, 1); s.flipped = false; }
  else if (act === "shuffle") { for (let i = s.order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [s.order[i], s.order[j]] = [s.order[j], s.order[i]]; } s.pos = 0; s.flipped = false; }
  else if (act === "toggle-unknown") { s.onlyUnknown = !s.onlyUnknown; s.pos = 0; s.flipped = false; }
  else if (act === "reset-known") { store.set("known-" + c.id, []); s.onlyUnknown = false; s.pos = 0; }
  else if (act === "know" || act === "again") {
    const idx = d[s.pos];
    act === "know" ? known.add(idx) : known.delete(idx);
    store.set("known-" + c.id, [...known]);
    s.flipped = false;
    if (!(act === "know" && s.onlyUnknown)) s.pos = (s.pos + 1) % Math.max(d.length, 1);
  }
  render();
}

document.addEventListener("keydown", e => {
  if (state.mode !== "cards" || state.search || e.target.matches("input, textarea")) return;
  const c = chap(state.ch);
  if (e.key === " " && !e.target.closest("button:not(#card)")) { e.preventDefault(); const k = $("#card"); if (k) { fc[c.id].flipped = !fc[c.id].flipped; k.classList.toggle("flipped"); } }
  else if (e.key === "ArrowRight") fcAction(c, "next");
  else if (e.key === "ArrowLeft") fcAction(c, "prev");
});
window.addEventListener("hashchange", fromHash);

/* ---------- boot ---------- */
if (location.hash.length > 1) fromHash();
else { const last = store.get("last", null); if (last && CHAPTERS.some(x => x.id === last)) state.ch = last; render(); }
</script>

</body></html>
